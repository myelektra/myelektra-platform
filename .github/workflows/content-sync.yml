# =============================================================================
# Myelektra Platform - TinaCMS Content Sync
# =============================================================================
# Purpose: Automatically deploy when content changes are pushed via TinaCMS
# Triggers: Push to content/ directory
# =============================================================================

name: Content Sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/content/**'
      - 'content/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # =============================================================================
  # Build and Deploy Content Changes
  # =============================================================================
  deploy-content:
    name: Deploy Content Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website with content
        run: pnpm --filter @myelektra/website build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          command: pages deploy dist/ --project-name=myelektra --branch=main

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 10
          curl -f https://myelektra.com/ || exit 1
          echo "✅ Content update deployed successfully!"

  # =============================================================================
  # Content Validation
  # =============================================================================
  validate-content:
    name: Validate Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TinaCMS content
        run: |
          echo "Validating content structure..."
          # Add content validation logic here
          # Example: Check required fields, validate slugs, etc.
          echo "✅ Content validation passed!"
