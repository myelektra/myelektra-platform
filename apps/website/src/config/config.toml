[site]
  title            = "Myelektra"
  description      = "AI-powered revenue growth partner helping B2B companies build structured, measurable revenue systems."
  tagline          = "Revenue Growth Solutions for B2B Companies"
  baseUrl          = "https://myelektra.com"
  logo             = "/logo-myelektra.png"
  logoWhite        = "/logo-myelektra.png"
  logoText         = "Myelektra"
  logoWidth        = "30px"
  logoHeight       = "30px"
  trailingSlash    = true

  [site.favicon]
    image = "/favicon.svg"

[seo]
  author   = "Myelektra"
  keywords = ["revenue growth", "B2B sales", "revenue intelligence", "pipeline management", "AI sales"]
  robots   = "index, follow"

  [seo.robotsTxt]
    enable   = true
    disallow = []

  [seo.sitemap]
    enable  = false
    exclude = []

[contact]
  location = "38th Floor, 88 Office, Kota Kasablanka, South Jakarta, Indonesia"
  phone    = "+62 21 29636761"
  email    = "info@myelektra.com"

[settings]
  blogFolder           = "blog"
  servicesFolder       = "services"
  caseStudiesFolder    = "case-studies"
  pagination           = 2
  stickyHeader         = true
  contactFormAction    = "https://formsubmit.co/info@myelektra.com"
  contactFormProvider  = "formsubmit.co"
  footerDescription    = ""

  [settings.copyright]
    enable = true
    text   = "Copyright © 2025 Myelektra. All Rights Reserved."

  [settings.subscription]
    enable     = false
    title      = ""
    formAction = ""

  [settings.multilingual]
    enable               = true
    defaultLanguage      = "en"
    disableLanguages     = ["fr"]
    showDefaultLangInUrl = false

  [settings.navigationButton]
    enable = true
    label  = ""
    url    = "/consultation"

  [settings.announcementBar]
    enable = false
    label  = ""

  [settings.markup.tableOfContents]
    enable     = false
    expanded   = false
    endLevel   = 5
    ordered    = false
    startLevel = 1

[opengraph]
  image       = "/images/og-image.jpg"
  ogLocale    = "en_US"
  ogType      = "website"
  twitter     = ""
  twitterCard = "summary_large_image"

[head]
  content = ""
